mimic_iv_version: "3.1"
t0: "ICU admission + 24 hours"
outcome_interval: "[T0, min(ICU admission + 7 days, hospital discharge, death))"
event: "first recorded serum sodium >=151 mmol/L"
icu_discharge_ends_followup: false
